<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniDiscos CBA</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="contenedor">

    <header>
        <img src="img/logo.png" class="logo" alt="MiniDiscos CBA">

        <p class="slogan">
            Tu música, siempre con vos
        </p>
    </header>

    <main class="tarjeta">

        <img id="portada" src="" alt="Portada">

        <span class="reproduciendo">
            ESTÁS ESCUCHANDO
        </span>

        <h1 id="artista"></h1>

        <h2 id="album"></h2>

        <div class="botones">

            <a id="spotify" class="boton spotify" target="_blank">
                🎵 Escuchar en Spotify
            </a>

            <a id="youtube" class="boton youtube" target="_blank">
    ▶ Escuchar en YouTube Music
</a>

<a
    class="boton instagram"
    href="https://www.instagram.com/minidiscos_cba/"
    target="_blank"
>
    📸 Seguinos en Instagram
</a>

<a id="comprar" class="boton comprar" target="_blank">
    ✨ Crear mi MiniCD
</a>

        </div>

    </main>

    <section class="info">

        <div class="item">
            <div class="icono">📀</div>
            <h3>Personalizado</h3>
            
        </div>

        <div class="item">
            <div class="icono">📱</div>
            <h3>NFC</h3>
            
        </div>

        <div class="item">
            <div class="icono">🎁</div>
            <h3>A pedido</h3>
           
        </div>

    </section>

    <footer>
        MiniDiscos CBA
        Tu música favorita en miniatura
    </footer>

</div>

<script src="js/app.js"></script>

</body>

</html>
